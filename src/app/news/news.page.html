<ion-header [translucent]="true">
    <ion-toolbar color="primary"> <ion-title> News </ion-title> </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
    <ion-header collapse="condense">
        <ion-toolbar color="primary">
            <ion-title size="large">News</ion-title>
        </ion-toolbar>
    </ion-header>

    <div *ngIf="!noticias || noticias.length === 0" class="ion-padding ion-text-center">
        <p>No hay noticias disponibles en este momento.</p>
    </div>

    <ion-card *ngFor="let noticia of noticias" [attr.data-id]="noticia.id">
        <img
            *ngIf="noticia.imagenUrl"
            [src]="noticia.imagenUrl"
            alt="Imagen de la noticia"
        />
        <ion-card-header>
            <ion-card-title>{{ noticia.titulo }}</ion-card-title>
            <ion-card-subtitle>{{ noticia.fecha }}</ion-card-subtitle>
        </ion-card-header>

        <ion-card-content>
            <p>{{ noticia.descripcion }}</p>

            <ion-button
                color="danger"
                (click)="eliminarNoticia(noticia)"
                class="ion-margin-top"
            >
                <ion-icon slot="start" name="trash-outline"></ion-icon>
                Eliminar
            </ion-button>
        </ion-card-content>
    </ion-card>
</ion-content>
