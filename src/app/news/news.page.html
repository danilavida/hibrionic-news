<div class="news-list-container">
    <ion-card *ngFor="let noticia of noticias$ | async" [attr.data-id]="noticia.id">
        <img
            *ngIf="noticia.imagenUrl"
            [src]="noticia.imagenUrl"
            alt="Imagen de la noticia"
        />
        <ion-card-header>
            <ion-card-title>{{ noticia.titulo }}</ion-card-title>
            <ion-card-subtitle>{{ noticia.fecha }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
            <p>{{ noticia.descripcion }}</p>
            <ion-button color="danger" (click)="eliminarNoticia(noticia)">
                <ion-icon slot="start" name="trash-outline"></ion-icon>
                Eliminar
            </ion-button>
        </ion-card-content>
    </ion-card>
</div>
